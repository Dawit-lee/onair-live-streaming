# 실행: cp .env.example .env && (값 채우기) && docker compose up -d --build
services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: onair
      MARIADB_USER: onair
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mariadb://db:3306/onair
      DB_USERNAME: onair
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-wss://${DOMAIN}}
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET}
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      JAVA_OPTS: -Xmx512m
    volumes:
      - recordings:/data/recordings

  livekit:
    image: livekit/livekit-server:v1.9
    restart: unless-stopped
    environment:
      # livekit-server는 LIVEKIT_CONFIG 환경변수를 설정 파일 본문으로 읽는다.
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP:-true}
          node_ip: ${LIVEKIT_NODE_IP:-}
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://backend:8080/api/livekit/webhook
        room:
          empty_timeout: 60
          departure_timeout: 10
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend, livekit]
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data

volumes:
  db-data:
  recordings:
  caddy-data:
