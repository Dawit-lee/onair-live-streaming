spring:
  application:
    name: onair
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/onair}
    username: ${DB_USERNAME:onair}
    password: ${DB_PASSWORD:onair}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${JWT_SECRET}
    ttl-seconds: ${JWT_TTL_SECONDS:43200}
  demo:
    enabled: ${DEMO_ENABLED:true}
    password: ${DEMO_PASSWORD:}
  livekit:
    public-url: ${LIVEKIT_PUBLIC_URL:ws://localhost:7880}
    api-url: ${LIVEKIT_API_URL:http://localhost:7880}
    api-key: ${LIVEKIT_API_KEY}
    api-secret: ${LIVEKIT_API_SECRET}
    token-ttl-seconds: 21600
  toss:
    client-key: ${TOSS_CLIENT_KEY:}
    secret-key: ${TOSS_SECRET_KEY:}
  recording:
    dir: ${RECORDING_DIR:./data/recordings}
